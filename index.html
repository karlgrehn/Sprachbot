<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Iris</h1>
      <p class="hint">Kein Menü, keine Einstellungen — beschreib, was du willst. <code>/help</code> zeigt, was Iris kann.</p>
      <p id="status-line" class="status">Prüfe lokales Modell &hellip;</p>

      <form id="prompt-form">
        <textarea
          id="prompt-input"
          rows="4"
          placeholder="Frag Iris etwas &hellip;"
          required
        ></textarea>
        <div class="row">
          <select id="model-select"></select>
          <button type="submit" id="send-button">Senden</button>
        </div>
      </form>

      <div id="output" aria-live="polite">
        <pre id="output-text"></pre>
        <div id="output-actions"></div>
      </div>
    </main>
  </body>
</html>

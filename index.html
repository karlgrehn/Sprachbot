<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris</title>

    <!-- PWA: macht dieselbe Oberfläche auf Android/iOS/Desktop installierbar
         (docs/PLAN.md, Abschnitt 4 — "iOS/Android: Thin, PWA, keine native App"). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f6f6f6" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Iris" />

    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="page">
      <header class="page-header">
        <h1>Iris</h1>
        <p class="hint">Kein Menü, keine Einstellungen — beschreib, was du willst. <code>/help</code> zeigt, was Iris kann.</p>
      </header>

      <p id="status-line" class="status">Prüfe lokales Modell &hellip;</p>

      <form id="prompt-form" class="composer">
        <select id="model-select" class="model-chip"></select>
        <textarea
          id="prompt-input"
          rows="1"
          placeholder="Frag Iris etwas &hellip;"
          required
        ></textarea>
        <button type="submit" id="send-button" class="send-btn" aria-label="Senden">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </form>

      <div id="output" aria-live="polite">
        <pre id="output-text"></pre>
        <div id="output-actions"></div>
      </div>

      <div id="pairing-panel" class="pairing-panel" hidden>
        <strong>Handy verbinden</strong>
        <p>
          Tailscale-App auf dem Handy mit demselben Konto anmelden, dann
          diesen Code mit der Kamera scannen:
        </p>
        <div id="pairing-qr" class="pairing-qr"></div>
        <p class="pairing-address-row">
          <code id="pairing-address"></code>
          <button type="button" id="pairing-copy">Kopieren</button>
        </p>
      </div>
    </main>
  </body>
</html>

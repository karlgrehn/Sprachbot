[package]
name = "iris-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iris_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Baut die Offline-Variante: bündelt Ollama + ein Modell als Sidecar, statt
# eine separat installierte Ollama-Instanz vorauszusetzen (siehe
# .github/workflows/release.yml, tauri.offline.conf.json).
offline-bundle = ["dep:tauri-plugin-shell"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.32"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"


[package]
name = "iris-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iris_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Kopfloser Hub ohne Tauri/Fenster - siehe src/bin/iris_hub.rs. Für
# Kommandozeilen-/Server-Betrieb (Raspberry Pi, Testbetrieb auf Windows).
name = "iris-hub"
path = "src/bin/iris_hub.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Kein Geschwindigkeitsverlust, der hier zählt: der Kern macht HTTP-Routing/
# JSON/Hardware-Erkennung, keine rechenintensiven Schleifen - die eigentliche
# Modell-Inferenz läuft im separaten Ollama-Sidecar. opt-level "z" +
# lto + codegen-units 1 + strip verkleinern das eigene Binary spürbar, ohne
# Funktionalität zu ändern (reine Codegen-Einstellungen). panic="abort" ist
# bewusst NICHT gesetzt - würde catch_unwind unmöglich machen, worauf Tauris
# eigene Fehlerbehandlung sich verlassen könnte.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[features]
# Baut die Offline-Variante: bündelt Ollama + ein Modell als Sidecar, statt
# eine separat installierte Ollama-Instanz vorauszusetzen (siehe
# .github/workflows/release.yml, tauri.offline.conf.json). tauri-plugin-shell
# selbst ist absichtlich KEINE optionale Abhängigkeit dieses Features mehr:
# Tauris Build-Skript validiert alle Dateien unter capabilities/ gegen die
# Permissions der tatsächlich kompilierten Plugins, unabhängig davon, ob eine
# Capability-Datei über security.capabilities überhaupt aktiv ist. Wäre
# tauri-plugin-shell optional, würde der normale Build (ohne dieses Feature)
# an "Permission shell:allow-execute not found" scheitern, weil
# capabilities/offline.json diese Permission referenziert.
offline-bundle = []

# Macht tauri + seine Plugins optional (siehe unten): iris-hub (headless,
# src/bin/iris_hub.rs) braucht kein Fenster/Webview und keine Sidecars,
# spricht direkt api::serve() an. Ohne diese Trennung würde JEDER Build
# der Bibliothek - auch der von iris-hub - transitiv webkit2gtk/gdk (Linux)
# mitkompilieren, was den Cross-Build für aarch64 (Raspberry Pi) auf einem
# x86_64-Runner erheblich verkompliziert hätte (GTK-Bindings cross-kompilieren
# ist deutlich aufwändiger als ein reiner Rust-Cross-Build). api.rs und alle
# von ihm genutzten Module (mcp, permissions, postfach, registry, ...)
# hängen ohnehin nie von tauri ab - per echtem grep bestätigt.
default = ["desktop-gui"]
desktop-gui = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-shell"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls statt des Default-Backends (native-tls/OpenSSL): der Android-Build
# (aarch64-linux-android) scheiterte damit real an "Could not find directory
# of OpenSSL installation" - OpenSSL cross-kompiliert nicht ohne eigenen
# Android-Sysroot. rustls ist reines Rust, kompiliert ohne C-Abhängigkeit
# für jedes Zielsystem (Windows/Linux/Android gleichermaßen).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Nur "system" (liefert total_memory()/refresh_memory(), siehe hardware.rs)
# statt der Default-Features - component/disk/network/user/multithread
# bringen ungenutzte Windows-COM/WMI-/Netzwerk-Bindings und einen ganzen
# Rayon-Thread-Pool mit, die hier nie aufgerufen werden.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "rt-multi-thread"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"


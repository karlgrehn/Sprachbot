name: Release

# Baut die echte Iris-App, weil das in keiner Sandbox möglich ist (fehlendes
# WebKitGTK/Windows-Toolchain) — siehe README, Abschnitt "Bekannte
# Einschränkung dieser Sandbox". Läuft auf echten GitHub-Runnern mit den
# richtigen Systemvoraussetzungen für Windows und Linux.
#
# Baut zwei Varianten pro Plattform:
# - normal: nur die App, setzt eine separat installierte Ollama voraus.
# - offline: bündelt Ollama + ein Modell (gemma3:1b) als Sidecar, läuft
#   nach der Installation ohne weitere Internetverbindung.
#
# Auslösen: manuell über "Run workflow" im Actions-Tab, oder durch einen
# Tag-Push (z. B. `git tag v0.1.0 && git push origin v0.1.0`).
#
# Öffentliche Downloads laufen über S3-kompatiblen Objektspeicher, nicht
# über GitHub Releases (siehe README, Abschnitt "Download-Hosting") — das
# Repo kann dadurch privat bleiben. Nötige Secrets, falls eingerichtet:
#   S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_PUBLIC_BASE_URL,
#   optional S3_ENDPOINT (leer lassen für echtes AWS S3; sonst z. B. die
#   R2-Endpunkt-URL). Ohne diese Secrets läuft der Build durch, aber der
#   Upload-Schritt wird übersprungen.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Systempakete installieren (WebKitGTK, nur ubuntu-latest)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend-Abhängigkeiten installieren
        run: npm install

      - name: Release-Tag bestimmen
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=iris-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # --- Normale Variante: nur die App, wie bisher ---
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "Iris (Vorabversion)"
          releaseBody: |
            Automatisch gebaut. M1–M3 (siehe docs/PLAN.md) — Kern, lokales
            Modell, Aktions-Registry, MCP-Client. Erfordert eine laufende
            Ollama-Installation auf dem Zielrechner.
          releaseDraft: true
          prerelease: true

      # --- Offline-Variante vorbereiten: echtes Ollama + echtes Modell ---
      - name: Ollama-Sidecar laden und Modell ziehen
        id: offline_prep
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            windows-latest)
              TARGET=x86_64-pc-windows-msvc
              # .zip (nicht .tgz/.tar.zst) fuer Windows.
              ASSET=ollama-windows-amd64.zip
              SIDECAR=ollama-${TARGET}.exe
              ;;
            ubuntu-22.04)
              TARGET=x86_64-unknown-linux-gnu
              # Ollama liefert Linux-Releases als .tar.zst aus (nicht mehr
              # .tgz/.tar.gz wie in frueheren Versionen) - per echtem
              # HTTP-Check bestaetigt, nachdem ein CI-Lauf mit dem alten
              # Dateinamen an "gzip: stdin: not in gzip format" scheiterte.
              ASSET=ollama-linux-amd64.tar.zst
              SIDECAR=ollama-${TARGET}
              ;;
          esac

          mkdir -p src-tauri/binaries ollama-runtime bundled-model
          # -f: bei einem 404 (z. B. erneuter Namenswechsel) soll curl hier
          # laut fehlschlagen, statt eine HTML-Fehlerseite stillschweigend
          # als "ollama-dl" abzulegen und erst beim Entpacken zu scheitern.
          curl -fsSL "https://github.com/ollama/ollama/releases/latest/download/${ASSET}" -o ollama-dl

          if [[ "$ASSET" == *.zip ]]; then
            # Git-Bash-eigenes "tar" auf windows-latest kann dieses .zip
            # nicht zuverlaessig lesen ("This does not look like a tar
            # archive") - 7-Zip ist auf GitHub-Windows-Runnern vorinstalliert.
            7z x -y -oollama-runtime ollama-dl >/dev/null
          else
            tar --zstd -xf ollama-dl -C ollama-runtime
          fi

          OLLAMA_BIN=$(find ollama-runtime -type f \( -iname "ollama.exe" -o -iname "ollama" \) | head -1)
          cp "$OLLAMA_BIN" "src-tauri/binaries/${SIDECAR}"
          chmod +x "src-tauri/binaries/${SIDECAR}" "$OLLAMA_BIN" 2>/dev/null || true

          # Ollama sucht seine nativen Laufzeitbibliotheken relativ zur
          # eigenen Programmdatei (Windows: <exe_dir>/lib/ollama,
          # Linux: <exe_dir>/../lib/ollama — keine verlässliche Env-Var
          # dafür). Wird als Ressource gebündelt; die exakte Platzierung
          # relativ zum Sidecar ist noch nicht auf einem echten Gerät
          # bestätigt, siehe README.
          if [ -d ollama-runtime/lib ]; then
            cp -r ollama-runtime/lib src-tauri/ollama-lib

            # Das Ollama-Release buendelt native Laufzeitbibliotheken fuer
            # JEDEN GPU-Backend (CUDA v12, CUDA v13, Vulkan) - zusammen
            # ueber 90% der Archivgroesse (~1,9-2,1 GB von ~1,9-1,94 GB je
            # nach Plattform, per echter Inspektion der Release-Assets
            # bestaetigt). Die Offline-Variante nutzt ohnehin nur CPU-
            # Inferenz (das ist genau das, was der Smoke-Test unten
            # verifiziert). Ungefiltert gebuendelt sprengt das den 2-GB-
            # Adressraum von NSIS' 32-Bit-makensis.exe ("Internal compiler
            # error #12345: error mmapping file ... is out of range") und
            # macht auch den Linux-Bundle-Schritt unnoetig groß/langsam.
            # Achtung Pfadtiefe: das Archiv liegt als lib/ollama/<backend>/...
            # vor, "cp -r ollama-runtime/lib src-tauri/ollama-lib" erhaelt
            # dieses eine Verschachtelungslevel ("ollama/") - der vorherige
            # Versuch loeschte src-tauri/ollama-lib/vulkan (falscher, zu
            # flacher Pfad), was durch "rm -rf" ohne Fehler still
            # verpuffte, weil der Pfad gar nicht existierte. Per echtem
            # Blick in die entpackte Struktur bestaetigt, nicht geraten.
            rm -rf src-tauri/ollama-lib/ollama/cuda_v12 src-tauri/ollama-lib/ollama/cuda_v13 src-tauri/ollama-lib/ollama/vulkan
            du -sh src-tauri/ollama-lib || true
          else
            echo "Kein lib/-Verzeichnis im Ollama-Release gefunden — nichts zu bündeln."
          fi

          # Echtes Ollama kurz lokal starten und ein echtes Modell ziehen —
          # dasselbe Modellverzeichnis, das später als Ressource gebündelt wird.
          export OLLAMA_MODELS="$PWD/bundled-model"
          "$OLLAMA_BIN" serve &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434 >/dev/null 2>&1 && break
            sleep 1
          done
          "$OLLAMA_BIN" pull gemma3:1b

          # Smoke-Test: echte Inferenz gegen genau das Modellverzeichnis, das
          # gebündelt wird — nicht nur "der Download hat geklappt".
          RESPONSE=$(curl -sS -X POST http://127.0.0.1:11434/api/generate \
            -d '{"model":"gemma3:1b","prompt":"Antworte nur mit OK.","stream":false}')
          echo "Smoke-Test-Antwort: $RESPONSE"
          echo "$RESPONSE" | grep -q '"response"'

          kill "$SERVE_PID" 2>/dev/null || true

          du -sh bundled-model || true
          echo "sidecar=${SIDECAR}" >> "$GITHUB_OUTPUT"

      - name: Offline-Variante bauen
        shell: bash
        # --verbose ist hier kein Debugging-Luxus, sondern noetig, um den
        # echten Fehler ueberhaupt zu sehen: Tauris eigener AppImage-Bundler
        # (crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy.rs)
        # verwirft linuxdeploys stderr komplett und meldet nur das nutzlose
        # "failed to run linuxdeploy", solange kein --verbose gesetzt ist
        # (per echtem Blick in den Tauri-Quellcode bestaetigt, nicht
        # geraten). APPIMAGE_EXTRACT_AND_RUN setzt Tauri intern ohnehin
        # bereits selbst (dieselbe Datei, Zeile ~191) - die eigene Env-Var
        # hier war redundant und wurde entfernt.
        run: npm run tauri build -- --verbose --config src-tauri/tauri.offline.conf.json --features offline-bundle

      # Noch nicht auf einem echten Gerät bestätigt: wo genau Tauri den
      # Ollama-Sidecar relativ zu den gebündelten Ressourcen (lib/, dist/,
      # bundled-model/) ablegt. Diese Ausgabe ist die Grundlage für einen
      # gezielten Korrektur-Commit, statt es zu erraten (siehe README).
      - name: Gestagte Verzeichnisstruktur prüfen (Sidecar vs. Ressourcen)
        shell: bash
        run: |
          echo "--- target/release (gestaged, vor der Paketierung) ---"
          find src-tauri/target/release -maxdepth 2 \
            -not -path "*/deps*" -not -path "*/build*" \
            -not -path "*/.fingerprint*" -not -path "*/incremental*" | sort
          echo ""
          echo "--- Enthält 'ollama' oder 'lib' oder 'bundled-model' oder 'dist' ---"
          find src-tauri/target/release -iname "*ollama*" -o -iname "bundled-model" -o -iname "dist" 2>/dev/null | grep -v -E "/(deps|build|\.fingerprint|incremental)/" | sort

      # --- Beide Varianten zu S3-kompatiblem Speicher hochladen ---
      - name: Nach S3-kompatiblem Speicher hochladen
        if: env.S3_BUCKET != ''
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          ENDPOINT_ARG=()
          if [ -n "${S3_ENDPOINT:-}" ]; then
            ENDPOINT_ARG=(--endpoint-url "$S3_ENDPOINT")
          fi

          case "${{ matrix.platform }}" in
            windows-latest)
              PLATFORM_KEY=windows
              NORMAL_FILE=$(find src-tauri/target/release/bundle/nsis -iname "Iris_*.exe" ! -iname "Iris-Offline_*" | head -1)
              OFFLINE_FILE=$(find src-tauri/target/release/bundle/nsis -iname "Iris-Offline_*.exe" | head -1)
              ;;
            ubuntu-22.04)
              PLATFORM_KEY=linux
              NORMAL_FILE=$(find src-tauri/target/release/bundle/appimage -iname "Iris_*.AppImage" ! -iname "Iris-Offline_*" | head -1)
              OFFLINE_FILE=$(find src-tauri/target/release/bundle/appimage -iname "Iris-Offline_*.AppImage" | head -1)
              ;;
          esac

          TAG="${{ steps.tag.outputs.name }}"
          NORMAL_KEY="iris/${TAG}/${PLATFORM_KEY}/$(basename "$NORMAL_FILE")"
          OFFLINE_KEY="iris/${TAG}/${PLATFORM_KEY}/$(basename "$OFFLINE_FILE")"

          aws s3 cp "$NORMAL_FILE" "s3://$S3_BUCKET/$NORMAL_KEY" "${ENDPOINT_ARG[@]}"
          aws s3 cp "$OFFLINE_FILE" "s3://$S3_BUCKET/$OFFLINE_KEY" "${ENDPOINT_ARG[@]}"

          NORMAL_SIZE=$(stat -c%s "$NORMAL_FILE" 2>/dev/null || stat -f%z "$NORMAL_FILE")
          OFFLINE_SIZE=$(stat -c%s "$OFFLINE_FILE" 2>/dev/null || stat -f%z "$OFFLINE_FILE")

          cat > manifest.json <<EOF
          {
            "platform": "${PLATFORM_KEY}",
            "tag": "${TAG}",
            "normal": { "url": "${S3_PUBLIC_BASE_URL}/${NORMAL_KEY}", "bytes": ${NORMAL_SIZE} },
            "offline": { "url": "${S3_PUBLIC_BASE_URL}/${OFFLINE_KEY}", "bytes": ${OFFLINE_SIZE} }
          }
          EOF
          cat manifest.json

          aws s3 cp manifest.json "s3://$S3_BUCKET/iris/manifest-${PLATFORM_KEY}.json" \
            "${ENDPOINT_ARG[@]}" --content-type application/json
